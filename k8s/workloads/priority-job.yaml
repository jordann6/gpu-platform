# High-priority job used to demonstrate preemption. Submitting this while the
# queue is saturated with low-priority work forces Kueue to evict a running
# low-priority Workload, requeue it, and admit this one in its place.
#
# The evicted job is requeued rather than lost, which is the property that
# makes preemption safe to enable on a shared cluster.
apiVersion: batch/v1
kind: Job
metadata:
  name: priority-job
  namespace: team-b
  labels:
    kueue.x-k8s.io/queue-name: gpu
    kueue.x-k8s.io/priority-class: high-priority
spec:
  suspend: true
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: burn
          image: nvcr.io/nvidia/cloud-native/dcgm:3.3.9-1-ubuntu22.04
          command: ["/usr/bin/dcgmproftester12"]
          args: ["--no-dcgm-validation", "-t", "1004", "-d", "180"]
          resources:
            limits:
              nvidia.com/gpu: 1
          securityContext:
            capabilities:
              add: ["SYS_ADMIN"]
