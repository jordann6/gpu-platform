# High-priority job used to demonstrate preemption. Submitting this while the
# queue is saturated with low-priority work forces Kueue to evict a running
# low-priority Workload, requeue it, and admit this one in its place.
#
# The evicted job is requeued rather than lost, which is the property that
# makes preemption safe to enable on a shared cluster.
apiVersion: batch/v1
kind: Job
metadata:
  name: priority-job
  namespace: team-b
  labels:
    kueue.x-k8s.io/queue-name: gpu
    kueue.x-k8s.io/priority-class: high-priority
spec:
  suspend: true
  parallelism: 1
  completions: 1
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      tolerations:
        - key: nvidia.com/gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: burn
          # See k8s/workloads/gpu-job.yaml for why this is nbody and not
          # dcgmproftester: the tester refuses to run on a CUDA 13 driver.
          image: nvcr.io/nvidia/k8s/cuda-sample:nbody-cuda11.7.1
          command: ["/bin/sh", "-c"]
          args:
            - |
              end=$(( $(date +%s) + 180 ))
              while [ "$(date +%s)" -lt "$end" ]; do
                /cuda-samples/nbody -benchmark -numbodies=262144 -numdevices=1 || exit 1
              done
          resources:
            limits:
              nvidia.com/gpu: 1
